name: Build Docker Image

on:
  # You can manually run this workflow.
  workflow_dispatch:
  # This workflow will run on every push to the main branch.
  push:
    branches:
      - main
    # Restrict the workflow to run only on changes to the following paths.
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build.yml'
      - 'src/**'
  # Validates PRs, including Dependabot's. Publish steps skip pull_request.
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'test/**'
      - 'build-tools/scripts/**'

# Per-ref, and never cancelled: this workflow pushes tags and creates a release,
# so cancelling a run mid-publish would leave the two out of sync.
concurrency:
  group: build-docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:

# ---------------------------------------------------------------------------------------

  build:

# ---------------------------------------------------------------------------------------

    name: "Build Docker Image"
    # https://github.com/actions/runner-images
    runs-on: ubuntu-24.04
    # The 360 minute default lets a stuck build hold a runner for hours.
    timeout-minutes: 180

    permissions:
      contents: write # permit to create a release on Github Releases
      packages: write # permit to upload and publish packages on GitHub Packages

    strategy:
      fail-fast: false
      matrix:
        config:
        - { debian_codename: "trixie", debian_version: "13" }

    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: ✂️ Free Disk Space
        uses: jlumbroso/free-disk-space@v2 # https://github.com/jlumbroso/free-disk-space
        with:
          preinstalled-runtimes: true
          docker-images: false
          # v2 no longer removes swap by default: doing so can OOM-kill the job.
          swap-storage: false

      - name: 🤘 Checkout Code
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      - name: 🛠️ Set TERM for shtool
        run: echo "TERM=xterm-256color" >> "$GITHUB_ENV"

      # Enforcing; passes cleanly with the rules ignored in .hadolint.yml.
      - name: 🔍 Run hadolint
        uses: hadolint/hadolint-action@v3 # https://github.com/hadolint/hadolint-action
        with:
          dockerfile: .devcontainer/debian/${{ matrix.config.debian_codename }}/Dockerfile

      # The trixie and bookworm Dockerfiles must differ only in their FROM lines.
      - name: 🔍 Check the Dockerfiles are in sync
        run: ./build-tools/scripts/check-dockerfiles-in-sync.sh

      - name: 🔒 Login to Github Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4 # https://github.com/docker/login-action
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU step: both builds are linux/amd64, which the runner has natively.
      - name: 🔽 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4 # https://github.com/docker/setup-buildx-action

      # generate metadata for the build-stage image
      - name: ✏ Setup Docker Metadata
        id: metadata-build-stage
        uses: docker/metadata-action@v6 # https://github.com/docker/metadata-action
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=auto
            prefix=${{ matrix.config.debian_codename }}-
          tags: |
            type=schedule,pattern={{ date 'YYYYMMDD' }}
            type=semver,pattern={{ version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=raw,value={{ date 'YYYYMMDD' }}-sha-{{ sha }},enabled=${{ github.event_name == 'push' }}
            type=raw,value=latest

      # generate metadata for the deploy image
      - name: ✏ Setup Docker Metadata
        id: metadata-deploy-stage
        uses: docker/metadata-action@v6 # https://github.com/docker/metadata-action
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=auto
            prefix=${{ matrix.config.debian_codename }}-deploy-
          tags: |
            type=schedule,pattern={{ date 'YYYYMMDD' }}
            type=semver,pattern={{ version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=raw,value={{ date 'YYYYMMDD' }}-sha-{{ sha }},enabled=${{ github.event_name == 'push' }}
            type=raw,value=latest

      - name: 🙏 Build Docker image (build-stage)
        uses: docker/build-push-action@v7 # https://github.com/docker/build-push-action
        with:
          context: .
          file: .devcontainer/debian/${{ matrix.config.debian_codename }}/Dockerfile
          target: build-stage
          platforms: linux/amd64
          # Stable local name for the test step below: on a pull_request
          # `latest=auto` emits no tag, so there is nothing else to reference.
          tags: |
            ${{ steps.metadata-build-stage.outputs.tags }}
            php-wasm-build-stage:ci
          labels: ${{ steps.metadata-build-stage.outputs.labels }}
          # Scoped per stage and per ref, so the builds cannot overwrite each
          # other and a pull request cannot poison main's cache.
          cache-from: type=gha,scope=build-stage-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=build-stage-${{ github.ref }}
          push: false
          load: true

      # The bridge is the only hand-written C here and it is what gets published,
      # so gate the artifact on its suite. Bind-mounted because the Dockerfile
      # only COPYs the bridge source, not the script or the tests.
      - name: 🧪 Run bridge tests
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            php-wasm-build-stage:ci \
            ./build-tools/scripts/test-bridge.sh

      - name: 🙏 Build Docker image (deploy-stage)
        uses: docker/build-push-action@v7 # https://github.com/docker/build-push-action
        with:
          context: .
          file: .devcontainer/debian/${{ matrix.config.debian_codename }}/Dockerfile
          target: deploy-stage
          platforms: linux/amd64
          # Stable local name for the artifact copy below, for the same reason as
          # the build-stage tag: `latest=auto` emits nothing on a pull_request.
          tags: |
            ${{ steps.metadata-deploy-stage.outputs.tags }}
            php-wasm-deploy-stage:ci
          labels: ${{ steps.metadata-deploy-stage.outputs.labels }}
          # Separate scope from the build stage, for the same reason.
          cache-from: type=gha,scope=deploy-stage-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=deploy-stage-${{ github.ref }}
          push: false
          load: true

      - name: ❔List Docker Images
        run: |
          docker images --format "table {{.ID}}\t{{.Repository}}\t{{.Tag}}\t{{.Size}}"
          docker images --digests

      # Per stage: `--all-tags` cannot tell the two stages' tags apart, since they
      # share a repository. Tags go via the environment, not interpolation.
      - name: 🐳 🚀 Push build-stage image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.metadata-build-stage.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" | grep -v '^[[:space:]]*$' | while read -r tag; do
            docker push "$tag"
          done

      - name: 🐳 🚀 Push deploy-stage image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.metadata-deploy-stage.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" | grep -v '^[[:space:]]*$' | while read -r tag; do
            docker push "$tag"
          done

      - name: 🔄 Copy build artifacts from the "deploy-stage" Docker image
        run: |
          set -euo pipefail
          container_id=$(docker create php-wasm-deploy-stage:ci)
          docker cp "$container_id:/php-wasm/" ./php-wasm
          docker rm "$container_id"

      # Read from the Dockerfile, not from the artifact: `find | head -n1` picks
      # an arbitrary file once the image holds more than one version.
      - name: 🏷️ Get PHP Version from Dockerfile
        run: |
          set -euo pipefail
          DOCKERFILE=".devcontainer/debian/${{ matrix.config.debian_codename }}/Dockerfile"
          PHP_VERSION=$(sed -n 's/^ARG PHP_VERSION=//p' "$DOCKERFILE" | head -n1)
          if [ -z "$PHP_VERSION" ]; then
            echo "::error::Could not read ARG PHP_VERSION from $DOCKERFILE"
            exit 1
          fi
          echo "PHP_WASM_VERSION=$PHP_VERSION" >> "$GITHUB_ENV"

      - name: 🏷️ Versioning of Artifact
        run: |
          echo "PHP_WASM_ARTIFACT_NAME=php-wasm-${{ env.PHP_WASM_VERSION }}" >> "$GITHUB_ENV"
          echo "PHP_WASM_ARTIFACT_ZIPFILE=php-wasm-${{ env.PHP_WASM_VERSION }}.zip" >> "$GITHUB_ENV"

      - name: 📦 Package Artifact
        run: |
          7z a -tzip -mx9 "${{ env.PHP_WASM_ARTIFACT_ZIPFILE }}" "php-wasm"

      - name: 📦 🚀 Upload Artifact
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: ${{ env.PHP_WASM_ARTIFACT_NAME }}
          path: ${{ env.PHP_WASM_ARTIFACT_ZIPFILE}}

      # Date plus short SHA: a date-only tag collides when two pushes land on
      # the same day, and the second `gh release create` fails the whole job.
      - name: 🏷️ Versioning of Release Tag
        if: github.event_name != 'pull_request'
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "RELEASE_TAG=${{ env.PHP_WASM_ARTIFACT_NAME }}-${BUILD_DATE}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: 📦 🚀 Create Release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="• PHP-WASM module using PHP v${{ env.PHP_WASM_VERSION }}"
          echo "🚀 Creating new release: ${{ env.RELEASE_TAG }}"
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "${{ env.RELEASE_TAG }}" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: 📦 🔼 Upload Release Artifact
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" "${{ env.PHP_WASM_ARTIFACT_ZIPFILE }}"
